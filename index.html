    <template data-chart="2_right/4_premisas/pre">

            <section class="nota amarilla">

                <ul>
                    <li>4bet a +30bb, solo pagamos con AA.</li>
                    <li>5bet a +40bb, solo pagamos con AA.</li>
                    <li>Si hacemos Cold 4bet y pushea EP/MP solo pagamos con AA y KK.</li>
                    <li>Si nos hacen Cold 4bet y estamos en EP/MP solo pagamos con AA y KK.</li>
                </ul>
            </section>
            <section class="nota verde">
                <h3>VS RECREACIONALES</h3>
                <ul>
                    <li>Si hace L/R, SQZ, 4BET tiene mano fuerte.</li>
                    <li>Short stack; si limpea roleamos a 33% de su stack con 99+, AJs+, AQo+ y vamos allin en cualquier flop.</li>
                    <li>Deep stack; si limpea roleamos a 33% de su stack con QQ+, AK y vamos allin en cualquier flop.</li>
                    <li>No jugar flips preflop para no regalar 50% de equity.</li>
                </ul>
            </section>

                <ul>
                    <li>Si hacen X/R flop, bet turn y push river, solo pagamos dobles+.</li>
                    <li>Si nos hacen Farha partimos de check en flop.</li>
                    <li>Raise o check/raise en river es muerte, solo pagamos con set+ si no hay carta doblada o color.</li>
                    <li>Donk en river es puro valor.</li>
                    <li>Si nos apuestan las 3 calles, es puro valor.</li>
                    <li>En board doblado no nos stackeamos ni con colores.</li>
                    <li>Si hacen check/raise en 3bet pot/4bet pot, solo pagamos doble+.</li>
                </ul>
                <h3>¡¡¡MI ENFOQUE NO ES GANAR DINERO<br>SINO TOMAR BUENAS DECISIONES!!!</h3>

    <script src="ranges.js"></script>
    <script>
        const RANKS = 'AKQJT98765432';
        const visor = document.getElementById('visor');

        function nombreMano(fila, col) {
            if (fila === col) return RANKS[fila] + RANKS[col];
            return fila < col ? RANKS[fila] + RANKS[col] + 's' : RANKS[col] + RANKS[fila] + 'o';
        }

        // "y50b50" -> [['y', 50], ['b', 50]]; "r" -> [['r', 100]]; "." -> []
        function parsearCelda(txt) {
            return [...txt.matchAll(/([rygb])(\d*)/g)].map(([, c, p]) => [c, p ? +p : 100]);
        }

        function leyendaDe(clave) {
            const grupo = Object.keys(LEYENDAS).find(g => clave.startsWith(g));
            return LEYENDAS[grupo] || [];
        }

        function dibujarRango(clave) {
            const leyenda = leyendaDe(clave);
            const nombres = Object.fromEntries(leyenda);
            const grilla = document.createElement('div');
            grilla.className = 'grilla';

            RANGOS[clave].forEach((linea, fila) => {
                linea.split(' ').forEach((txt, col) => {
                    const celda = document.createElement('div');
                    const mano = nombreMano(fila, col);
                    const partes = parsearCelda(txt);
                    celda.className = 'celda';
                    celda.textContent = mano;

                    if (partes.length) {
                        let x = 0;
                        const stops = partes.map(([c, p]) => `var(--c-${c}) ${x}% ${(x += p)}%`);
                        if (x < 100) stops.push(`var(--c-vacia) ${x}%`);
                        celda.style.backgroundImage = `linear-gradient(to right, ${stops.join(', ')})`;
                        celda.classList.add('jugada');
                        celda.title = mano + ': ' + partes.map(([c, p]) => `${nombres[c] || ''} ${p}%`.trim()).join(' · ');
                    }
                    grilla.appendChild(celda);
                });
            });

            const pie = document.createElement('figcaption');
            pie.className = 'leyenda';
            leyenda.forEach(([c, texto]) => {
                const item = document.createElement('span');
                item.innerHTML = `<i style="background: var(--c-${c})"></i>${texto}`;
                pie.appendChild(item);
            });

            visor.replaceChildren(grilla);
            if (leyenda.length) visor.appendChild(pie);
        }

        function mostrar(clave) {
            const plantilla = document.querySelector(`template[data-chart="${clave}"]`);
            if (plantilla) visor.replaceChildren(plantilla.content.cloneNode(true));
            else dibujarRango(clave);
        }

        document.querySelectorAll('button[data-chart]').forEach(boton => {
            boton.addEventListener('click', () => {
                document.querySelector('button.activo')?.classList.remove('activo');
                boton.classList.add('activo');
                mostrar(boton.dataset.chart);
            });
        });
    </script>
